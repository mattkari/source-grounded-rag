# CHOMPS E1 gold questions — template v1
#
# HOW TO FILL (Matt, ~1 h per 10 questions):
#   1. Write the question in plain English, as a reader of the thesis would ask it.
#   2. Pick ONE expected_type:
#        ANSWERABLE   — the thesis answers it from specific pages
#        PARTIAL      — the thesis addresses it but only partly / one perspective
#        UNANSWERABLE — plausibly asked, but the thesis does NOT contain the answer
#        ADVERSARIAL  — contains a false premise or bait, correct behaviour = refusal/pushback
#   3. For ANSWERABLE/PARTIAL: list gold_pages = pdf_page numbers you KNOW hold the answer.
#      Use `python3 -m sgrag.evalpage <n>` (once LAB-46 lands) or grep the JSONL to find them.
#      Page labels only — NEVER paste thesis text into this file.
#   4. Leave expected_answer_summary as 1 short line (your words, not quotes).
#   5. Notes: anything a grader should know (traps, near-miss pages).
#
# RULES
#   - No thesis verbatim text below the marker line (paper must stay anonymous).
#   - If unsure of a page number, leave it as null — LAB-45 validates and reports mismatches.
#   - Aim: 15 ANSWERABLE / 5 PARTIAL / 7 UNANSWERABLE / 3 ADVERSARIAL across 30.
#     Batches: LAB-42 = first 10 ANSWERABLE; LAB-43 = 5 ANSWERABLE + 5 PARTIAL;
#     LAB-44 = 7 UNANSWERABLE + 3 ADVERSARIAL.

metadata:
  template_version: 1
  corpus: karimov-2017-quranic-justice (288 pdf pages)
  created_for: CHOMPS 2027 E1 evaluation
